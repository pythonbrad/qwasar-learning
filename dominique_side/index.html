<html>
    <div
        id="my_box_realtime"
        style="background-color: red; position: absolute; right: 70; bottom: 70; min-width: 100px; min-height: 100px"
    ></div>
    <script type="text/javascript">
        var box = document.getElementById("my_box_realtime");

        const viewportWidth = window.innerWidth;        // to initialize the square position top left
        const viewportHeight = window.innerHeight;
        
        box.style.right = viewportWidth - 100 ;
        box.style.bottom = viewportHeight - 100 ;
    

	function moveToCorner() {        
		var right = box.style.right.replace("px", "");
		var bottom = box.style.bottom.replace("px", "");
		var repeat = 1;

		if (right > 0) {
			box.style.right = right - 1;
			repeat = true;
		}
		if (bottom > 0) {
			box.style.bottom = bottom - 1;
			repeat = true;
		}

		console.log("move " + right + " " + bottom);

		if (!repeat) return;

		setTimeout(moveToCorner, 500);
	}

	moveToCorner();
    </script>
</html>
